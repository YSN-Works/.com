<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEcom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="60%" stop-color="#141418" />
      <stop offset="100%" stop-color="#0E0E12" />
    </linearGradient>
    <radialGradient id="glowRed" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#E50932" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgEcom)" />
  <circle cx="950" cy="200" r="350" fill="url(#glowRed)" />

  <!-- Browser Frame -->
  <g transform="translate(140, 90)">
    <rect width="920" height="620" rx="16" fill="#111113" stroke="rgba(255,255,255,0.10)" stroke-width="1.5" />
    <!-- Header -->
    <rect width="920" height="48" rx="16" fill="#171719" />
    <circle cx="28" cy="24" r="6" fill="#FF5F56" />
    <circle cx="48" cy="24" r="6" fill="#FFBD2E" />
    <circle cx="68" cy="24" r="6" fill="#27C93F" />
    <rect x="200" y="14" width="520" height="20" rx="6" fill="rgba(255,255,255,0.06)" />
    <text x="460" y="28" fill="#A1A1AA" font-family="'Space Grotesk', sans-serif" font-size="11" text-anchor="middle" letter-spacing="1">MODERN-STOREFRONT.YSNWORKS.DEV</text>

    <!-- Content -->
    <g transform="translate(50, 80)">
      <rect width="130" height="26" rx="13" fill="rgba(229,9,50,0.15)" stroke="rgba(229,9,50,0.4)" />
      <text x="65" y="17" fill="#E50932" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">WEB DEVELOPMENT</text>
      
      <text x="0" y="80" fill="#F5F5F5" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="44" letter-spacing="-1">RESPONSIVE BRAND FLAGSHIP</text>
      <text x="0" y="115" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="14">Custom modern website with smooth interaction, dynamic catalogs, and fast load times.</text>

      <!-- Mockup Catalog Grid -->
      <g transform="translate(0, 150)">
        <rect width="255" height="280" rx="12" fill="#171719" stroke="rgba(255,255,255,0.08)" />
        <rect x="20" y="20" width="215" height="150" rx="8" fill="#222228" />
        <circle cx="127" cy="95" r="35" fill="rgba(229,9,50,0.2)" stroke="#E50932" stroke-width="1.5" />
        <text x="20" y="205" fill="#F5F5F5" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16">Editorial Minimal Series</text>
        <text x="20" y="235" fill="#E50932" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="18">Rs. 15,000</text>

        <rect x="285" y="0" width="255" height="280" rx="12" fill="#171719" stroke="rgba(255,255,255,0.08)" />
        <rect x="305" y="20" width="215" height="150" rx="8" fill="#222228" />
        <rect x="375" y="65" width="75" height="60" rx="6" fill="rgba(255,255,255,0.08)" />
        <text x="305" y="205" fill="#F5F5F5" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16">Performance Collection</text>
        <text x="305" y="235" fill="#E50932" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="18">Rs. 32,000</text>

        <rect x="570" y="0" width="250" height="280" rx="12" fill="#171719" stroke="rgba(255,255,255,0.08)" />
        <rect x="590" y="20" width="210" height="150" rx="8" fill="#222228" />
        <polygon points="695,65 745,125 645,125" fill="none" stroke="#E50932" stroke-width="2" />
        <text x="590" y="205" fill="#F5F5F5" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16">High-End Custom Suite</text>
        <text x="590" y="235" fill="#E50932" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="18">Rs. 59,000</text>
