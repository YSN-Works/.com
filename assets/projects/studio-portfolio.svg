      <text x="0" y="110" fill="#E50932" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20">Personal Brand &amp; Digital Craft</text>
      <text x="0" y="145" fill="#A1A1AA" font-family="'Inter', sans-serif" font-size="14" width="600">Bespoke portfolio showcasing web engineering, thumbnail design, and video editing.</text>

