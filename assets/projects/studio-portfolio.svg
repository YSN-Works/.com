      <stop offset="0%" stop-color="#09090B" />
      <stop offset="50%" stop-color="#141416" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgStudio)" />

  <g transform="translate(140, 90)">
